# 1. Site identity ------------------------------------------------------------
title       : "Francesco Rentocchini"
description : "Economist working on the economics of innovation and science, industrial organisation, innovation policy and entrepreneurship. University of Ferrara."
url         : "https://frarent.github.io"
baseurl     : ""
locale      : "en_GB"
lang        : "en"
timezone    : "Europe/Rome"

# 2. Author / sidebar profile -------------------------------------------------
author:
  name        : "Francesco Rentocchini"
  avatar      : "/images/francesco-rentocchini.jpg"
  tagline     : "Economics of innovation & science"
  affiliation : "University of Ferrara"
  location    : "Ferrara, Italy"
  email       : "francesco.rentocchini@unife.it"

# Profile links shown in the sidebar (order kept as written).
links:
  - name: "Google Scholar"
    url : "https://scholar.google.com/citations?user=2cH43vsAAAAJ&hl=en"
  - name: "ORCID"
    url : "https://orcid.org/0000-0002-6414-0577"
  - name: "IDEAS/RePEc"
    url : "https://ideas.repec.org/e/pre185.html"
  - name: "LinkedIn"
    url : "https://www.linkedin.com/in/francescorentocchini"
  - name: "GitHub"
    url : "https://github.com/frarent"

# 3. Search engines -----------------------------------------------------------
google_site_verification: "QR55eFT4DyXHzA7UBFapDabREqf0lK98umn9v_qZ_yI"

# 4. Build --------------------------------------------------------------------
markdown    : kramdown
kramdown:
  input       : GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
permalink   : pretty

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _pages
exclude:
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - UPDATE_REPORT.md

defaults:
  - scope: { path: "" }
    values: { layout: "default" }
